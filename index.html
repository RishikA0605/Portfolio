    <!-- Critical inline styles so the loader paints before any JS -->
    <style>
      html { background: #0f1226; }
      @media (prefers-color-scheme: light) { html { background: #f4f2fb; } }
      #loader {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #0f1226; color: #edeaf5;
        font: 500 clamp(13px, 1.4vw, 16px)/1.9 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: light) { #loader { background: #f4f2fb; color: #15172b; } }
      #loader .term { min-width: min(420px, 84vw); }
      #loader .line { opacity: 0; white-space: pre; }
      #loader .line.on { opacity: 1; }
      #loader .ok { color: #8ce0b0; }
      #loader .caret { display: inline-block; width: .6em; height: 1.1em; vertical-align: -0.2em; background: currentColor; animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="term">
        <div class="line">&gt; booting portfolio v2.0</div>
        <div class="line">&gt; loading frontend ... <span class="ok">ok</span></div>
        <div class="line">&gt; loading backend ... <span class="ok">ok</span></div>
        <div class="line">&gt; loading database ... <span class="ok">ok</span></div>
        <div class="line">&gt; ready <span class="caret"></span></div>
      </div>
    </div>

    <div id="root"></div>
